name: Vérification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Application web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ispt
          POSTGRES_PASSWORD: ispt
          POSTGRES_DB: ispt_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ispt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ispt:ispt@localhost:5432/ispt_ci
      DIRECT_URL: postgresql://ispt:ispt@localhost:5432/ispt_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installation
        run: npm ci

      - name: Mise en forme
        run: npm run format:check

      - name: Analyse statique
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Base de données (migrations et données initiales)
        run: npx prisma migrate deploy && npm run db:initialiser

      # Avant le build : les pages publiques mises en cache (campagne ouverte…)
      # sont générées à partir de ces données.
      - name: Données de test de bout en bout
        run: npx tsx tests/e2e/preparer.ts

      - name: Build
        run: npm run build

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (accès par rôle, accessibilité)
        run: npm run test:e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: web/test-results
          retention-days: 7
